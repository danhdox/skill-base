name: Validate Skills

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate skill files and catalog
        run: python3 scripts/validate_skills.py

      - name: Check README catalog sync
        run: python3 scripts/sync_readme_catalog.py --check
